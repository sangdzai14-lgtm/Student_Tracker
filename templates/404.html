{% extends "base.html" %}

{% block title %}Node Not Found | 404 Error{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center text-center" data-aos="zoom-in">
    <div class="relative mb-12">
        <h1 class="text-[12rem] font-black tracking-tighter leading-none opacity-5">404</h1>
        <div class="absolute inset-0 flex items-center justify-center">
            <div class="w-32 h-32 bg-primary/20 rounded-[3rem] border border-primary/30 flex items-center justify-center animate-pulse">
                <i data-lucide="ghost" class="w-12 h-12 text-primary"></i>
            </div>
        </div>
    </div>

    <h2 class="text-3xl font-black tracking-tighter mb-4 text-white">Neural Path Terminated</h2>
    <p class="text-slate-500 max-w-sm mx-auto mb-12 font-medium">The requested node coordinate does not exist in the current PTIT intelligence map.</p>

    <a href="/" class="px-12 py-4 bg-primary text-primary-foreground rounded-2xl font-black text-xs uppercase tracking-[0.2em] shadow-lg hover:shadow-primary/50 transition-all active:scale-[0.98]">
        Return to Logic Core
    </a>
</div>
{% endblock %}
